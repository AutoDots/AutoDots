<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braille Translator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 2em; }
        textarea { width: 100%; height: 100px; }
        #response { margin-top: 1em; padding: 1em; border: 1px solid #ccc; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Braille Translator</h1>
    <p>Ask a question like: "How do I write Happy Birthday Mum in grade 1 braille?"</p>
    <form id="chat-form">
        <textarea id="query-input" placeholder="Enter your query here..."></textarea>
        <button type="submit">Translate</button>
    </form>
    <div id="response"></div>

    <script src="/static/main.js"></script>
</body>
</html>
